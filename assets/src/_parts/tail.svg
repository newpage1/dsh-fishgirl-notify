  <g fill="#FFF1E6" opacity="0.55">
    <path d="M 586 694 q 22 -16 44 0 q -22 16 -44 0 Z"/>
    <path d="M 618 716 q 24 -16 48 0 q -24 16 -48 0 Z"/>
    <path d="M 650 740 q 24 -16 48 0 q -24 16 -48 0 Z"/>
  </g>
</g>
</svg>